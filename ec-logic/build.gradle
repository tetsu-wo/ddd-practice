// ddd-practice/ec-logic/build.gradle

// このモジュールはJavaのプロジェクトであることを宣言します
plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
}


// 1. プロジェクトの基本情報（ここに正式に記述します）
group = 'io.github.tetsu-wo'
version = '1.0.0-SNAPSHOT'
// ★追加：ライブラリをダウンロードしてくる倉庫（リポジトリ）を指定します
repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // 【追記】データを保存・管理する仕組み（これで @Transactional が使えるようになります）
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // 1. Jakarta Validation のインターフェース定義
    implementation 'jakarta.validation:jakarta.validation-api:3.0.2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // 2. バリデーションを実際に動かすための実装体（必須）
    implementation 'org.hibernate.validator:hibernate-validator:8.0.1.Final'
    // Spring Data JPA (データベース操作の仕組み)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.4'


    // MySQL Connector (MySQLに接続するためのドライバー)
    runtimeOnly 'com.mysql:mysql-connector-j'

    // 3. Hibernate Validator が内部で依存する表現言語エンジン（必須）
    implementation 'org.glassfish:jakarta.el:4.0.2'
    // FlywayのコアライブラリとMySQL用コネクタ
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'


//    runtimeOnly 'com.h2database:h2'

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    testCompileOnly 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'


    // 将来的にSpring BootやJPAを使う場合は、ここにライブラリを追記します
    // 現時点では、標準的なJavaの機能のみでビルドするため空で大丈夫です
    // JUnit5（テスト用ライブラリ）の依存関係を追加

    // 👈 多くの環境で一番安定して動く 5.10.2 にバージョンを少し下げます
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.3'

    // 2. ★超重要：今回のエラー（Failed to load JUnit Platform）を解決するためのランチャー
    // これを明示的に追加することで、Gradle Test Executorが正常に起動できるようになります！
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
//    // これ1本で API、Params、Engine（Platform）がすべて揃います
//    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
//    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
//    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.11.0' // バージョンは環境に合わせて調整してください
//    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'

}

//test {
//    useJUnitPlatform() // テスト実行時にJUnitを使用する規約
//}

tasks.named('test') {
    useJUnitPlatform()
}


// IntelliJのKotlin同期プラグインのエラーを強制的に回避する設定
tasks.register("prepareKotlinBuildScriptModel") {}


// build.gradle の一番下にこれを貼り付けます
tasks.named('compileJava') {
    // 🌟 エラーが出ている「他のドメインフォルダ」をコンパイルから完全に無視させる設定
    // ※ "other_domain" の部分を、実際にエラーが起きているフォルダ名に書き換えてください
    exclude '**/domain/promotion/**'
}

bootRun {
    standardInput = System.in
}


